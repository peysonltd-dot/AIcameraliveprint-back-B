<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="768" viewBox="0 0 1024 768">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf7"/>
      <stop offset="0.55" stop-color="#f8fbf8"/>
      <stop offset="1" stop-color="#fffaf0"/>
    </linearGradient>
    <radialGradient id="blueWash">
      <stop offset="0" stop-color="#77c9e6" stop-opacity="0.38"/>
      <stop offset="0.68" stop-color="#9ed8eb" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#bfe7f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tealWash">
      <stop offset="0" stop-color="#46a5a4" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#73c7bd" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="yellowWash">
      <stop offset="0" stop-color="#f7dc75" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#f7dc75" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
